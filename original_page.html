<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLIMATERIA · 气候万象志</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <style>
        /* ===== 全局变量与重置 ===== */
        :root {
            --font-cn: 'FZKaiTi', '方正楷体', 'KaiTi', 'STKaiti', '华文楷体', '楷体', 'Kaiti SC', 'SimSun', serif;
            --font-en: 'Goudy Old Style', 'ZCOOL XiaoWei', 'Georgia', serif;
            --gold: #d4af37;
            --gold-bright: #f0d060;
            --gold-deep: #b8942a;
            --ink-deep: #0a1128;
            --ink-mid: #1a3a5c;
            --paper-warm: #f0ece0;
            --paper-cool: #e8dcc8;
            --seal-red: #b53a2a;
            --seal-red-deep: #8b3a2a;
            --parchment-text: #1a1208;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-cn);
        }

        body {
            font-family: var(--font-cn);
            overflow: hidden;
            background: var(--ink-deep);
            color: var(--paper-warm);
        }

        /* ===== 首页蒙版层 ===== */
        #overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a3a5c 0%, #0a1128 50%, #1a3a5c 100%);
            z-index: 100;
            opacity: 1;
            transition: opacity 1.6s ease-out;
        }
        #overlay.fade-out { opacity: 0; pointer-events: none; }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.3) 0%, transparent 70%);
            animation: ripple-fade 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes ripple-fade {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 0.6; transform: scale(1.2); }
        }
        .star-point {
            position: absolute;
            top: 50%; left: 50%;
            width: 4px; height: 4px;
            background: #f0d060;
            border-radius: 50%;
            box-shadow: 0 0 20px #f0d060, 0 0 40px #d4af37;
            animation: star-pulse 3s ease-in-out infinite;
        }
        @keyframes star-pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.5); }
        }

        #poetry {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; z-index: 101; opacity: 0;
        }
        #poetry.show { animation: poetry-appear 6.3s ease-in-out forwards; }
        @keyframes poetry-appear {
            0% { opacity: 0; } 10% { opacity: 0; } 15% { opacity: 1; }
            75% { opacity: 1; } 100% { opacity: 0; }
        }
        .poetry-line {
            font-size: 28px;
            color: #FFF8E7;
            margin: 20px 0;
            opacity: 0;
            text-shadow: 0 0 10px rgba(240, 208, 96, 0.5);
            font-family: var(--font-cn);
            font-weight: 400;
            letter-spacing: 6px;
        }
        .poetry-line:nth-child(1) { animation: line-appear 0.8s ease-out 2.1s forwards; }
        .poetry-line:nth-child(2) { animation: line-appear 0.8s ease-out 2.9s forwards; }
        .poetry-line:nth-child(3) { animation: line-appear 0.8s ease-out 3.7s forwards; }
        @keyframes line-appear { to { opacity: 1; } }

        /* ===== 首页背景图 ===== */
        #landing-page {
            position: fixed; inset: 0;
            background: url('首页背景底图.png') center center / contain no-repeat;
            z-index: 1; opacity: 0;
            transition: opacity 1.6s ease-out;
        }
        #landing-page.show { opacity: 1; }
        #landing-page.hide { opacity: 0; pointer-events: none; }

        /* ===== 涟漪按钮 ===== */
        #start-button-container {
            position: fixed; top: 65%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; opacity: 0; pointer-events: none;
            transition: opacity 1s ease-out;
        }
        #start-button-container.show { opacity: 1; pointer-events: auto; }

        .start-button {
            position: relative; background: transparent;
            border: none; cursor: pointer;
            padding: 40px 60px; text-align: center; outline: none;
        }
        .start-button::before, .start-button::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.6);
            animation: button-ripple 3.2s ease-out infinite;
            pointer-events: none;
        }
        .start-button::before { width: 100px; height: 100px; animation-delay: 0s; }
        .start-button::after { width: 100px; height: 100px; animation-delay: 0.8s; }
        .ripple-layer-3, .ripple-layer-4 {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.4);
            animation: button-ripple 3.2s ease-out infinite;
            pointer-events: none;
        }
        .ripple-layer-3 { width: 100px; height: 100px; animation-delay: 1.6s; }
        .ripple-layer-4 { width: 100px; height: 100px; animation-delay: 2.4s; }
        @keyframes button-ripple {
            0% { width: 100px; height: 100px; opacity: 0.8; }
            100% { width: 300px; height: 300px; opacity: 0; }
        }
        .start-button:hover .ripple-layer-3, .start-button:hover .ripple-layer-4,
        .start-button:hover::before, .start-button:hover::after {
            animation-duration: 2s;
        }
        .start-button:hover .main-text {
            text-shadow: 0 0 30px rgba(240, 208, 96, 0.9), 0 0 50px rgba(212, 175, 55, 0.6);
            filter: brightness(1.2);
        }
        .main-text {
            font-size: 42px;
            font-family: var(--font-cn);
            font-weight: 700;
            background: linear-gradient(135deg, #d4af37 0%, #f0d060 50%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(240, 208, 96, 0.6));
            margin-bottom: 10px;
            letter-spacing: 12px;
            transition: all 0.3s ease;
        }
        .sub-text {
            font-size: 13px;
            font-family: var(--font-en);
            font-weight: 700;
            color: rgba(212, 175, 55, 0.7);
            letter-spacing: 4px;
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .start-button.clicked .main-text,
        .start-button.clicked .sub-text,
        .start-button.clicked .ripple-layer-3,
        .start-button.clicked .ripple-layer-4 {
            animation: ink-fade 1.2s ease-out forwards;
        }
        .start-button.clicked::before, .start-button.clicked::after {
            animation: ink-fade 1.2s ease-out forwards;
        }
        @keyframes ink-fade { to { opacity: 0; transform: scale(1.1); } }

        /* ===== 主页面 ===== */
        #main-page {
            position: fixed; inset: 0;
            z-index: 50; opacity: 0; pointer-events: none;
            transition: opacity 1.2s ease-out;
            background: var(--ink-deep);
            display: flex;
            flex-direction: column;
        }
        #main-page.show { opacity: 1; pointer-events: auto; }

        /* ===== 顶部导航 ===== */
        .navbar {
            position: relative;
            width: 100%; height: 64px;
            background: rgba(10, 17, 40, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 100;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid transparent;
            border-image: linear-gradient(90deg, transparent, #d4af37, #f0d060, #d4af37, transparent) 1;
            flex-shrink: 0;
        }
        .nav-title {
            font-size: 22px;
            color: #FFF8E7;
            text-shadow: 0 0 15px rgba(240, 208, 96, 0.5);
            font-weight: 700;
            letter-spacing: 4px;
            display: flex; align-items: baseline;
        }
        .nav-title .en-text {
            font-family: var(--font-en);
            font-weight: 700;
            letter-spacing: 3px;
        }
        .nav-title .cn-text {
            font-family: var(--font-cn);
            font-weight: 700;
        }
        .nav-buttons { display: flex; gap: 30px; }
        .nav-btn {
            background: transparent; border: none;
            color: #888;
            font-size: 16px;
            font-family: var(--font-cn);
            font-weight: 400;
            cursor: pointer;
            padding: 8px 16px;
            transition: all 0.3s ease;
            position: relative;
            letter-spacing: 4px;
        }
        .nav-btn.active {
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.6);
        }
        .nav-btn.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 80%; height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, transparent);
        }
        .nav-btn:hover {
            color: #f0d060;
            text-shadow: 0 0 15px rgba(240, 208, 96, 0.8);
        }

        /* ===== 地图区域（世界气候地图） ===== */
        .map-container {
            position: relative;
            flex: 1;
            width: 100%;
            overflow: visible;
            background: var(--ink-deep);
            display: flex;
            align-items: stretch;
            justify-content: center;
            z-index: 91;
        }
        .map-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            user-select: none;
            -webkit-user-drag: none;
            padding: 0 4px;
        }

        /* 27个交互圆点 */
        #dots-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }
        .dot {
            position: absolute;
            width: 18px; height: 18px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s ease;
            transform: translate(-50%, -50%);
            z-index: 5;
            color: #fff;
        }
        .dot::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.4;
            animation: dot-pulse 3s ease-in-out infinite;
        }
        .dot::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
            animation: dot-breathe 2.4s ease-in-out infinite;
        }
        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes dot-breathe {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        .dot:hover, .dot.active {
            transform: translate(-50%, -50%) scale(1.4);
            z-index: 20;
        }
        .dot:hover::after, .dot.active::after {
            box-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
            opacity: 1;
        }

        /* ===== 底部卷轴（牛皮纸） ===== */
        .scroll-container {
            position: relative;
            width: 100%;
            height: 180px;
            flex-shrink: 0;
            background: url('底部牛皮纸（新）.jpg') center center / 100% 100% no-repeat;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        /* 牛皮纸上的暗角与质感 */
        .scroll-container::before {
            content: '';
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at center, transparent 60%, rgba(20, 10, 5, 0.15) 100%),
                linear-gradient(180deg, rgba(40, 25, 10, 0.05) 0%, transparent 30%, transparent 70%, rgba(40, 25, 10, 0.08) 100%);
            pointer-events: none;
        }
        /* 四纵列透明容器，浮于牛皮纸之上，介于地图与牛皮纸下底之间 */
        .scroll-content {
            position: absolute;
            z-index: 2;
            top: 8px;
            left: 0;
            right: 0;
            bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            padding: 0 2%;
            font-family: var(--font-cn);
            transition: opacity 0.3s ease-out;
            pointer-events: none;
        }
        .scroll-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 12px;
        }
        .scroll-col-row {
            font-family: var(--font-cn);
            font-weight: 700;
            color: #3d1f08;
            text-shadow: 0 1px 0 rgba(255, 245, 230, 0.4), 0 0 8px rgba(212, 175, 55, 0.15);
            letter-spacing: 2px;
        }
        .scroll-col:nth-child(2) {
            margin-left: 10%;
        }
        .scroll-col-name {
            font-size: 24px;
            line-height: 1.4;
        }
        .scroll-col-motto {
            font-size: 19px;
            font-style: italic;
            line-height: 1.5;
            padding: 0 6px;
        }
        .scroll-col-region {
            font-size: 18px;
            line-height: 1.4;
        }
        .scroll-col-hint {
            font-size: 16px;
            line-height: 1.4;
        }
        .scroll-divider {
            width: 1px;
            height: 70%;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(212, 175, 55, 0.1) 15%, 
                rgba(240, 208, 96, 0.35) 30%,
                rgba(240, 208, 96, 0.5) 50%,
                rgba(240, 208, 96, 0.35) 70%,
                rgba(212, 175, 55, 0.1) 85%,
                transparent 100%
            );
            box-shadow: 0 0 4px rgba(240, 208, 96, 0.25);
            flex-shrink: 0;
        }

        /* ===== 详情遮罩 ===== */
        .detail-overlay {
            position: fixed; inset: 0;
            background: rgba(14, 26, 43, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 200;
            opacity: 0; pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .detail-overlay.show { opacity: 1; pointer-events: auto; }

        /* ===== 详情卡片（羊皮纸风格） ===== */
        .detail-card {
            position: fixed;
            top: 50%; right: -500px;
            transform: translateY(-50%);
            width: 460px; max-width: 85vw;
            height: 90vh; max-height: 700px;
            background: linear-gradient(135deg, #f0ece0 0%, #e8dcc8 100%);
            border-left: 3px solid var(--gold);
            z-index: 201;
            overflow-y: auto;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 40px 32px 32px;
            box-shadow: -8px 0 40px rgba(0, 0, 0, 0.4), inset 0 0 80px rgba(120, 80, 30, 0.08);
        }
        .detail-card.show { right: 40px; }

        /* 羊皮纸纹理叠加层 */
        .detail-card::before {
            content: '';
            position: absolute; inset: 0;
            background:
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 3px,
                    rgba(184, 148, 42, 0.04) 3px,
                    rgba(184, 148, 42, 0.04) 6px
                ),
                radial-gradient(ellipse at top right, rgba(180, 130, 50, 0.08), transparent 60%),
                radial-gradient(ellipse at bottom left, rgba(120, 80, 30, 0.06), transparent 60%);
            pointer-events: none;
            z-index: 0;
        }
        .detail-card > * { position: relative; z-index: 1; }

        /* 详情卡关闭按钮 */
        .detail-close {
            position: absolute;
            top: 16px; right: 16px;
            width: 32px; height: 32px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold-deep);
            cursor: pointer;
            font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
            z-index: 3;
            font-family: var(--font-cn);
            border-radius: 2px;
        }
        .detail-close:hover {
            background: var(--gold);
            color: var(--paper-warm);
            transform: rotate(90deg);
        }

        .detail-header {
            display: flex; gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px dashed rgba(120, 80, 30, 0.3);
            margin-bottom: 24px;
        }
        .detail-avatar {
            width: 70px; height: 70px;
            flex-shrink: 0;
            border-radius: 50%;
            border: 2px solid var(--gold);
            display: flex; align-items: center; justify-content: center;
            font-size: 32px;
            background: rgba(255, 250, 230, 0.5);
        }
        .detail-header-info { flex: 1; }
        .detail-name {
            font-size: 32px;
            color: #1a1208;
            margin-bottom: 4px;
            font-weight: 700;
            font-family: var(--font-cn);
            letter-spacing: 4px;
            line-height: 1.1;
        }
        .detail-title {
            font-size: 16px;
            color: var(--gold-deep);
            font-family: var(--font-cn);
            font-weight: 400;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }
        .detail-subtitle {
            font-size: 13px;
            color: #6b4525;
            font-family: var(--font-cn);
            letter-spacing: 1px;
        }
        .en-detail {
            font-family: var(--font-en);
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* 三折结构 */
        .detail-section {
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px dashed rgba(120, 80, 30, 0.2);
        }
        .detail-section:last-child { border-bottom: none; }
        .detail-section-title {
            font-size: 18px;
            color: var(--gold-deep);
            margin-bottom: 10px;
            font-family: var(--font-cn);
            font-weight: 700;
            letter-spacing: 6px;
            display: flex; align-items: center; gap: 8px;
        }
        .detail-section-title::before {
            content: '';
            display: inline-block;
            width: 4px; height: 16px;
            background: var(--gold);
            border-radius: 2px;
        }
        .detail-section-content {
            font-size: 15px;
            color: #2a1810;
            line-height: 1.9;
            font-family: var(--font-cn);
            font-weight: 400;
            letter-spacing: 1px;
            padding-left: 12px;
        }
        .detail-row {
            display: flex; gap: 8px;
            margin-bottom: 6px;
            font-family: var(--font-cn);
        }
        .detail-row .label {
            color: #6b4525;
            min-width: 80px;
            font-weight: 700;
            font-family: var(--font-cn);
        }
        .detail-row .value {
            color: #2a1810;
            flex: 1;
            font-family: var(--font-cn);
        }

        /* 引语区 */
        .detail-quote {
            padding: 14px 16px;
            background: rgba(180, 130, 50, 0.06);
            border-left: 3px solid var(--gold);
            margin: 12px 0;
            font-family: var(--font-cn);
            font-style: italic;
            color: #2a1810;
            line-height: 1.7;
            font-size: 15px;
            letter-spacing: 1px;
        }

        /* 意象标签 */
        .imagery-tags {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin-top: 8px;
            font-family: var(--font-cn);
        }
        .imagery-tag {
            font-size: 12px;
            padding: 2px 10px;
            background: rgba(180, 130, 50, 0.1);
            border: 1px solid rgba(120, 80, 30, 0.2);
            border-radius: 10px;
            color: #4a2e1c;
            font-family: var(--font-cn);
        }

        /* "合上卷轴"涟漪按钮 */
        .close-scroll-btn {
            position: absolute;
            bottom: 80px; left: 50%;
            transform: translateX(-50%);
            background: transparent;
            border: 1.5px solid var(--gold);
            color: var(--gold-deep);
            font-family: var(--font-cn);
            font-size: 15px;
            font-weight: 700;
            padding: 10px 32px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 3;
            border-radius: 4px;
            letter-spacing: 4px;
            overflow: hidden;
        }
        .close-scroll-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 0; height: 0;
            border-radius: 50%;
            background: var(--gold);
            opacity: 0.2;
            transition: width 0.5s ease, height 0.5s ease;
        }
        .close-scroll-btn:hover::before {
            width: 200px; height: 200px;
        }
        .close-scroll-btn:hover {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            color: var(--seal-red);
        }
        .close-scroll-btn span {
            position: relative;
            z-index: 1;
        }

        /* 朱砂印章 */
        .stamp {
            position: absolute;
            bottom: 32px; right: 32px;
            width: 64px; height: 64px;
            background: var(--seal-red);
            color: var(--paper-warm);
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: var(--font-cn);
            z-index: 3;
            letter-spacing: 2px;
            border: 2px solid var(--seal-red-deep);
            box-shadow:
                inset 0 0 12px rgba(80, 20, 10, 0.6),
                inset 2px 2px 8px rgba(255, 220, 200, 0.15),
                0 2px 8px rgba(80, 20, 10, 0.4);
            /* 印章斑驳效果 */
            background-image:
                radial-gradient(circle at 20% 30%, transparent 0%, transparent 8%, rgba(255, 240, 220, 0.15) 8%, rgba(255, 240, 220, 0.15) 12%, transparent 12%),
                radial-gradient(circle at 75% 65%, transparent 0%, transparent 6%, rgba(255, 240, 220, 0.12) 6%, rgba(255, 240, 220, 0.12) 10%, transparent 10%),
                radial-gradient(circle at 50% 80%, transparent 0%, transparent 4%, rgba(0, 0, 0, 0.15) 4%, rgba(0, 0, 0, 0.15) 7%, transparent 7%),
                radial-gradient(circle at 30% 70%, transparent 0%, transparent 3%, rgba(0, 0, 0, 0.1) 3%, rgba(0, 0, 0, 0.1) 6%, transparent 6%),
                linear-gradient(135deg, var(--seal-red) 0%, var(--seal-red-deep) 100%);
            transform: rotate(-8deg);
        }

        { id: 12, name: '巴特尔', englishName: 'Baatar', title: '长风守望者', position: '次子·次兄', climate: '温带草原气候', region: '蒙古高原', country: '蒙古国', family: '草原家', familyEmoji: '🌾', color: '#c49a3c', personality: '均衡之灵·边界扎根', motto: '风来的时候我不弯腰，只把根扎得更深一寸。', spiritualPower: '均衡之灵——四季呼吸间找到边界平衡', imagery: ['蒙古包', '骏马', '雄鹰', '马头琴'], easter: '手握一把马头琴，琴音里有草浪与鹰的翅膀', familyMotto: '风过处，皆有我们的足印。', siblings: '凯瑞·帕查·塔拉', temperatureFamily: '干燥少雨', fullDescription: '巴特尔，蒙古语中的"英雄"与"勇士"，他是草原家的次子，守护着蒙古高原的温带草原。他身穿深蓝色蒙古袍，腰系银带，手握一把马头琴，琴音里有草浪与鹰的翅膀。他的灵力是"均衡之灵"，因为在这里，四季不是在渐变，而是在呼吸——每一季都有其边界。', position2: { x: 40, y: 13 } },

        { id: 13, name: '帕查', englishName: 'Pacha', title: '南美游牧者', position: '三子·三弟', climate: '热带草原气候', region: '巴西高原', country: '巴西', family: '草原家', familyEmoji: '🌾', color: '#c49a3c', personality: '节奏之灵·桑巴鼓点', motto: '大哥在非洲渡河，二哥在蒙古等雪，而我在南美守着一整片高原的节拍。', spiritualPower: '节奏之灵——旱雨季交替如桑巴鼓点', imagery: ['大食蚁兽', '凤梨花', '水葫芦', '巴西高原'], easter: '腰间挂着一只水葫芦容器', familyMotto: '风过处，皆有我们的足印。', siblings: '凯瑞·巴特尔·塔拉', temperatureFamily: '温暖干燥', fullDescription: '帕查，克丘亚语中的"大地"与"世界"，他是草原家的三子，守护着巴西高原的热带草原。他腰间挂着一只水葫芦容器，保存着每一场雨季的第一滴水——那是他用来"校准节拍"的音叉。', position2: { x: 50, y: 60 } },

        { id: 14, name: '塔拉', englishName: 'Tara', title: '澳洲游牧者', position: '四子·四弟', climate: '热带草原气候', region: '澳大利亚北部', country: '澳大利亚', family: '草原家', familyEmoji: '🌾', color: '#c49a3c', personality: '火草之灵·再生之火', motto: '我的火和雨交替着来——火把土地烧成红色，雨再把它浇成绿色。', spiritualPower: '火草之灵——旱季烈火与雨季绿意交替', imagery: ['袋鼠', '桉树', '白千层', '雷暴野火'], easter: '身上绘有原住民风格的点彩图腾', familyMotto: '风过处，皆有我们的足印。', siblings: '凯瑞·巴特尔·帕查', temperatureFamily: '炎热干燥', fullDescription: '塔拉，澳大利亚原住民语中的"岩石"与"土地"，他是草原家的四子，守护着澳大利亚北部那片被烈火与雨季交替塑造的热带草原。旱季时，雷暴引发的野火是这片草原最炽热的语言——火不是毁灭，而是再生的前奏。', position2: { x: 46, y: 60 } },

        { id: 15, name: '莱依姆', englishName: 'Laïm', title: '赤金守夜人', position: '长女·长姐', climate: '热带沙漠气候', region: '撒哈拉', country: '阿尔及利亚', family: '干旱家', familyEmoji: '🏜️', color: '#b8804a', personality: '记忆之灵·沙藏古海', motto: '你以为我渴？不。我只是把海藏在了每一粒沙里。', spiritualPower: '记忆之灵——撒哈拉曾为湿润草原，沙粒封存远古河床', imagery: ['金字塔', '单峰驼', '沙狐', '琥珀眼瞳'], easter: '眼眸是琥珀色的，像被风沙打磨了千年的宝石', familyMotto: '我们把海藏在了沙里。', siblings: '卡里姆·瓦拉', temperatureFamily: '炎热干燥', fullDescription: '莱依姆，柏柏尔语中的"金沙"，她是干旱家的长女，守护着撒哈拉沙漠——这片面积超过900万平方公里、地球上最大的热带沙漠。她的灵力是"记忆之灵"，因为撒哈拉并非生来就是沙漠——在数万年前，它曾是湿润的草原与湖泊。', position2: { x: 14, y: 30 } },

        { id: 16, name: '卡里姆', englishName: 'Karim', title: '新月独行者', position: '次子·次兄', climate: '热带沙漠气候', region: '阿拉伯半岛', country: '沙特阿拉伯', family: '干旱家', familyEmoji: '🏜️', color: '#b8804a', personality: '星辰之灵·商队灯塔', motto: '我这里的白天是金子的颜色，夜晚是墨水的颜色——商队在金子与墨水之间走了三千年。', spiritualPower: '星辰之灵——极端温差使夜空清澈，星明导航', imagery: ['椰枣', '贝都因帐篷', '清真寺', '阿拉伯商队'], easter: '腰间挂着一个装满香料的铜壶', familyMotto: '我们把海藏在了沙里。', siblings: '莱依姆·瓦拉', temperatureFamily: '炎热干燥', fullDescription: '卡里姆，阿拉伯语中的"慷慨"与"高贵"，他是干旱家的次子，守护着阿拉伯半岛的热带沙漠。他的灵力是"星辰之灵"，因为沙漠白昼极端炎热（可达50℃），夜晚却因无云层保温而急剧降温（可降至10℃以下），这种极端的温差使夜空异常清澈，星光明亮如导航的灯塔。', position2: { x: 25, y: 32 } },

        { id: 17, name: '瓦拉', englishName: 'Wala', title: '红土独梦者', position: '三子·三弟', climate: '热带沙漠气候', region: '澳大利亚中部', country: '澳大利亚', family: '干旱家', familyEmoji: '🏜️', color: '#b8804a', personality: '梦时之灵·梦时走远', motto: '我不是沙，我是梦。我在时间里走得最远，比海更远，比风更远。', spiritualPower: '梦时之灵——时间不走钟表走梦时', imagery: ['艾尔斯岩', '袋鼠', '蛋白石', '原住民岩画'], easter: '坐在一块红色岩石上，手中握着一块蛋白石', familyMotto: '我们把海藏在了沙里。', siblings: '莱依姆·卡里姆', temperatureFamily: '炎热干燥', fullDescription: '瓦拉，澳大利亚原住民语中的"火"与"燃烧"，他是干旱家的三子，守护着澳大利亚中部那片覆盖了大陆约40%面积的红土沙漠。他的灵力是"梦时之灵"，因为在这片沙漠里，时间不走钟表，只走"梦时"——那是原住民理解世界的方式，数万年前的歌谣仍在石壁上回响。', position2: { x: 46, y: 74 } },

        { id: 18, name: '伊莱拉', englishName: 'Elara', title: '薄雾织者', position: '长女·长姐', climate: '温带海洋性气候', region: '西欧', country: '英国', family: '西风家', familyEmoji: '🍃', color: '#7a96a8', personality: '薄雾之灵·温柔多变', motto: '我不是没有性格，我只是把性格藏在了每一场雨里。', spiritualPower: '薄雾之灵——将多变天气编织成永不停止的薄雾', imagery: ['灰蓝斗篷', '雨伞', '薄雾', '大西洋暖流'], easter: '身披灰蓝色斗篷，手持一把永远潮湿的雨伞', familyMotto: '温柔，是最绵长的力量。', siblings: '西尔维·瑟西拉', temperatureFamily: '温和湿润', fullDescription: '伊莱拉，希腊语中的"光辉"，她是西风家的长女，守护着西欧的温带海洋性气候。她的性格温柔而多变，情绪如雾般细腻而难以捉摸——正如温带海洋性气候的"阴晴不定"，一日之内阳光与细雨交替出现。她的灵力是"薄雾之灵"，因为西风带带来的气旋活动是西欧天气多变的核心驱动力。', position2: { x: 15, y: 17 } },

        { id: 19, name: '西尔维', englishName: 'Sylvie', title: '雾影守望者', position: '次女·次妹', climate: '温带海洋性气候', region: '北美西海岸', country: '美国', family: '西风家', familyEmoji: '🍃', color: '#7a96a8', personality: '雾林之灵·红木水源', motto: '雾是我写给太平洋的诗——姐姐读得懂，海浪读得懂，红木也读得懂。', spiritualPower: '雾林之灵——雾是红木林的"水源"', imagery: ['红木林', '海狮', '苔藓', '月光石'], easter: '肌肤如月光石般透亮，卷曲浅棕长发间别着红木叶', familyMotto: '温柔，是最绵长的力量。', siblings: '伊莱拉·瑟西拉', temperatureFamily: '温和湿润', fullDescription: '西尔维，法语中的"森林"，她是西风家的次女，守护着北美西海岸温带海洋性气候下的温带雨林——红木林。她的灵力是"雾林之灵"，因为这里的雾不仅仅是一种天气现象——它是红木林的"水源"，红木林的树冠能够截留雾气中的水分，让森林在旱季依然保持湿润。', position2: { x: 68, y: 25 } },

        { id: 20, name: '瑟西拉', englishName: 'Cersila', title: '西风孤望者', position: '养女', climate: '地中海气候', region: '澳洲西南部', country: '澳大利亚', family: '西风家', familyEmoji: '🍃', color: '#7a96a8', personality: '旱夏之灵·等待雨信', motto: '我不等风来，我等雨信。', spiritualPower: '旱夏之灵——漫长干渴中等待冬季雨水', imagery: ['桉树叶', '石灰岩', '贝壳', '麻质长裙'], easter: '手中握着一枚扁平的贝壳或一截干枯的桉树枝', familyMotto: '温柔，是最绵长的力量。', siblings: '伊莱拉·西尔维', temperatureFamily: '温暖干燥', fullDescription: '瑟西拉，拉丁语中"西风之女"的化身，她是西风家的养女，守护着澳大利亚西南部的地中海气候——这是全球五大地中海气候区中最孤悬于大洋之中的一个。她不是伊莱拉和西尔维正式承认的妹妹，而是西风带上被遗忘的一支。每年雨季结束后，她会寄一片干枯的桉树叶给伊莱拉。', position2: { x: 36, y: 73 } },

        { id: 21, name: '维塔', englishName: 'Vitya', title: '西伯利亚守望者', position: '长子·长兄', climate: '温带大陆性气候', region: '西伯利亚', country: '俄罗斯', family: '大陆家', familyEmoji: '🏔️', color: '#5a6a7a', personality: '大寒之灵·年轮记忆', motto: '冷，让我记得更清楚。', spiritualPower: '大寒之灵——泰加林极寒缓慢生长', imagery: ['针叶林', '雪豹', '驯鹿', '冰封湖面'], easter: '背着一把复合弓，箭囊里装着冰晶制成的箭', familyMotto: '冷，让我们记得更久。', siblings: '沈寒川·列昂', temperatureFamily: '冬冷夏热', fullDescription: '维塔，俄语中的"胜利者"，他是大陆家的长子，守护着西伯利亚的温带大陆性气候——这片土地是地球上最寒冷的人类居住区之一，冬季均温低至-40℃。他的灵力是"大寒之灵"，因为这里的针叶林——泰加林——是地球上最大的森林带，它们在极寒中缓慢生长，年轮极窄极密，每一圈年轮都是对寒冷的一次确认。', position2: { x: 24, y: 11 } },

        { id: 22, name: '沈寒川', englishName: 'Shen Hanchuan', title: '丝路驼铃', position: '次子·次兄', climate: '温带大陆性气候', region: '中国西北', country: '中国', family: '大陆家', familyEmoji: '🏔️', color: '#5a6a7a', personality: '大漠之灵·丝路诗篇', motto: '我的夏天和冬天，隔着一整个秋天的距离。', spiritualPower: '大漠之灵——温差如冰火交替', imagery: ['莫高窟', '月牙泉', '胡杨', '丝路古道'], easter: '身穿褪色棉袍，内侧用碳灰写着丝路诗', familyMotto: '冷，让我们记得更久。', siblings: '维塔·列昂', temperatureFamily: '冬冷夏热', fullDescription: '沈寒川，名字中的"寒川"是寒冷的大河，他是大陆家的次子，守护着中国西北与内蒙古的温带大陆性气候。中国西北深居亚洲内陆，距海遥远，加上青藏高原的抬升阻挡了来自印度洋的水汽，使这片土地成为典型的干旱半干旱温带大陆性气候区，冬寒夏暑、温差巨大是它的标志。', position2: { x: 32, y: 23 } },

        { id: 23, name: '列昂', englishName: 'Leon', title: '平原独行者', position: '三子·三弟', climate: '温带大陆性气候', region: '北美中西部', country: '美国', family: '大陆家', familyEmoji: '🏔️', color: '#5a6a7a', personality: '风暴之灵·龙卷之语', motto: '我不是沉默的大陆，我把所有的话都藏在风里。', spiritualPower: '风暴之灵——全球最密集龙卷风带', imagery: ['野牛', '大峡谷', '麦田', '龙卷风'], easter: '戴着一顶牛仔帽，帽檐上插着一根鹰羽', familyMotto: '冷，让我们记得更久。', siblings: '维塔·沈寒川', temperatureFamily: '冬冷夏热', fullDescription: '列昂，希腊语中的"狮子"，他是大陆家的三子，守护着北美中西部大平原的温带大陆性气候。他的灵力是"风暴之灵"，因为北美大陆内部这种极端的温差与平原地形共同塑造了全球最密集的龙卷风带——平均每年超过1000次。', position2: { x: 73, y: 24 } },

        { id: 24, name: '纳努克', englishName: 'Nanuk', title: '冰原回音者', position: '长女·长姐', climate: '寒带·冰原气候', region: '格陵兰', country: '丹麦', family: '寒冰家', familyEmoji: '❄️', color: '#a8c0d0', personality: '时间之灵·冰芯档案', motto: '我沉默，因为需要记住的事情太多了。', spiritualPower: '时间之灵——冰原本身是时间的档案馆', imagery: ['北极熊', '冰盖', '冰芯气泡', '冰蓝长袍'], easter: '身穿月白与冰蓝交织的长袍，衣袍上绣有冰芯气泡的图案', familyMotto: '冰封，是为了记住。', siblings: '索尔维格', temperatureFamily: '极寒', fullDescription: '纳努克，因纽特语中的"北极熊"，她是寒冰家的长女，守护着格陵兰岛——全球最大的岛屿，其80%以上的面积被永久冰盖覆盖，冰层平均厚度超过1500米。格陵兰冰盖是北半球最大的冰体，冰芯中封存着过去80万年的地球气候记录——每一层冰、每一个气泡都记录着远古大气的成分、温度和二氧化碳浓度。', position2: { x: 87, y: 5 } },

    /* ===== 首页动画流程 ===== */
    setTimeout(() => {
        document.getElementById('poetry').classList.add('show');
    }, 500);
    setTimeout(() => {
        document.getElementById('overlay').classList.add('fade-out');
        document.getElementById('landing-page').classList.add('show');
    }, 6800);
    setTimeout(() => {
        document.getElementById('start-button-container').classList.add('show');
    }, 8400);

    /* 创建7处涟漪 */
    function createRipples() {
        const overlay = document.getElementById('overlay');
        const positions = [
            { x: 20, y: 30 }, { x: 80, y: 25 }, { x: 15, y: 70 },
            { x: 85, y: 65 }, { x: 30, y: 80 }, { x: 70, y: 75 }, { x: 50, y: 20 }
        ];
        positions.forEach((pos, index) => {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = pos.x + '%';
            ripple.style.top = pos.y + '%';
            ripple.style.width = '100px';
            ripple.style.height = '100px';
            ripple.style.animationDelay = (index * 0.5) + 's';
            overlay.appendChild(ripple);
        });
    }
    createRipples();

    /* ===== 开始按钮 ===== */
    document.getElementById('startBtn').addEventListener('click', function() {
        this.classList.add('clicked');
        setTimeout(() => {
            document.getElementById('landing-page').classList.add('hide');
            document.getElementById('start-button-container').style.opacity = '0';
            document.getElementById('start-button-container').style.pointerEvents = 'none';
            setTimeout(() => {
                document.getElementById('landing-page').style.display = 'none';
                document.getElementById('main-page').classList.add('show');
                createDots();
            }, 1200);
        }, 800);
    });

    /* ===== 创建27个交互圆点 ===== */
    function createDots() {
        const container = document.getElementById('dots-container');

        characters.forEach(char => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.color = char.color;
            dot.style.left = char.position2.x + '%';
            dot.style.top = char.position2.y + '%';
            dot.dataset.id = char.id;

            dot.addEventListener('mouseenter', function() {
                this.classList.add('hover');
                updateScroll(char);
            });
            dot.addEventListener('mouseleave', function() {
                this.classList.remove('hover');
            });
            dot.addEventListener('click', function(e) {
                e.stopPropagation();
                document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
                this.classList.add('active');
                showDetail(char);
                updateScroll(char);
            });

            container.appendChild(dot);
        });
    }

    /* ===== 更新卷轴文字 ===== */
    function updateScroll(char) {
        const scrollContent = document.getElementById('scrollContent');
        scrollContent.style.opacity = '0';
        setTimeout(() => {
            scrollContent.innerHTML = `
                <div class="scroll-divider"></div>
                <div class="scroll-col"><div class="scroll-col-row scroll-col-name">${char.name}</div><div class="scroll-col-row scroll-col-name" style="font-size:13px;">${char.climate}</div></div>
                <div class="scroll-divider"></div>
                <div class="scroll-col"><div class="scroll-col-row scroll-col-motto">"${char.motto}"</div></div>
                <div class="scroll-divider"></div>
                <div class="scroll-col"><div class="scroll-col-row scroll-col-region">${char.region}</div><div class="scroll-col-row scroll-col-region" style="font-size:13px;">${char.country}</div></div>
                <div class="scroll-divider"></div>
                <div class="scroll-col"><div class="scroll-col-row scroll-col-hint">✦ 悬停探索</div><div class="scroll-col-row scroll-col-hint">点击了解详情</div></div>
                <div class="scroll-divider"></div>
            `;
            scrollContent.style.opacity = '1';
        }, 150);
    }

    /* ===== 显示详情卡片 ===== */
    function showDetail(char) {
        const overlay = document.getElementById('detailOverlay');
        const card = document.getElementById('detailCard');
        const content = document.getElementById('detailContent');
        const stamp = document.getElementById('stamp');

        // 重置印章状态
        stamp.textContent = '收藏';
        stamp.classList.remove('collected');

        content.innerHTML = `
            <div class="detail-header">
                <div class="detail-avatar">${char.familyEmoji}</div>
                <div class="detail-header-info">
                    <div class="detail-name">${char.name}</div>
                    <div class="detail-title">${char.title} · ${char.position}</div>
                    <div class="detail-subtitle"><span class="en-detail">${char.englishName}</span> · ${char.climate}</div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">形貌</div>
                <div class="detail-section-content">${char.fullDescription}</div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">血脉</div>
                <div class="detail-section-content">
                    <div class="detail-row"><span class="label">家族：</span><span class="value">${char.familyEmoji} ${char.family}</span></div>
                    <div class="detail-row"><span class="label">家族格言：</span><span class="value">"${char.familyMotto}"</span></div>
                    <div class="detail-row"><span class="label">亲缘：</span><span class="value">${char.siblings}</span></div>
                    <div class="detail-row"><span class="label">温度属性：</span><span class="value">${char.temperatureFamily}</span></div>
                    <div class="detail-row"><span class="label">灵力：</span><span class="value">${char.spiritualPower}</span></div>
                </div>
            </div>

            <div class="detail-section">
                <div class="detail-section-title">灵言</div>
                <div class="detail-quote">"${char.motto}"</div>
                <div class="detail-row"><span class="label">性格：</span><span class="value">${char.personality}</span></div>
                <div class="detail-row"><span class="label">意象：</span></div>
                <div class="imagery-tags">${char.imagery.map(img => '<span class="imagery-tag">' + img + '</span>').join('')}</div>
                <div class="detail-row" style="margin-top:10px;"><span class="label">彩蛋：</span><span class="value">${char.easter}</span></div>
            </div>
        `;

        overlay.classList.add('show');
        card.classList.add('show');
    }

    /* ===== 关闭详情卡片 ===== */
    function closeDetail() {
        document.getElementById('detailOverlay').classList.remove('show');
        document.getElementById('detailCard').classList.remove('show');
        document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
    }

    document.getElementById('detailClose').addEventListener('click', closeDetail);
    document.getElementById('detailOverlay').addEventListener('click', closeDetail);
    document.getElementById('closeScrollBtn').addEventListener('click', closeDetail);

    /* ===== 收藏印章 ===== */
    document.getElementById('stamp').addEventListener('click', function() {
        if (this.classList.contains('collected')) return;
        this.classList.add('collected');
        this.textContent = '已收藏';
        setTimeout(() => {
            this.classList.remove('collected');
            this.textContent = '收藏';
        }, 2400);
    });

    /* ===== 导航按钮（其他4个敬请期待） ===== */
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (!this.classList.contains('active')) {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                if (this.textContent !== '万象图') {
                    showToast(this.textContent + ' · 敬请期待');
                }
            }
        });
    });

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ===== 键盘 ESC 关闭 ===== */
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeDetail();
    });
    </script>
</body>
